name: Refresh mint feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-mint-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan OpenSea and Robinhood Chain
        run: python scan.py --mode quick
      - name: Commit fresh public data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/scan_cache.json public/scan_history.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/scan_cache.json public/scan_history.json
          git commit -m 'Update mint feed'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish updated snapshot on Vercel
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo '::error::Add the VERCEL_DEPLOY_HOOK repository secret.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --request POST "$VERCEL_DEPLOY_HOOK"
